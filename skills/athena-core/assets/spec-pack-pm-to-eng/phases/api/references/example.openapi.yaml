openapi: 3.0.3
info:
  title: 訂單服務
  version: 1.0.0
servers:
- url: /api/v1
tags:
- name: 訂單管理 API
  description: 訂單的 CRUD + 業務操作
paths:
  /orders:
    get:
      operationId: listOrder
      summary: list Order
      tags:
      - 訂單管理 API
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      operationId: createOrder
      summary: create Order
      tags:
      - 訂單管理 API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
  /orders/{id}:
    get:
      operationId: readOrder
      summary: read Order
      tags:
      - 訂單管理 API
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateOrder
      summary: update Order
      tags:
      - 訂單管理 API
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteOrder
      summary: delete Order
      tags:
      - 訂單管理 API
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: 成功
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /orders/{id}/apply-refund:
    post:
      operationId: orderApplyRefund
      summary: apply refund
      tags:
      - 訂單管理 API
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: VALIDATION_FAILED
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string
    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 訂單代理鍵
        customerId:
          type: integer
          format: int64
          description: 下單客戶
        status:
          type: string
          enum:
          - pending
          - paid
          - shipped
          - cancelled
          description: 訂單狀態
        totalAmount:
          type: number
          format: decimal
          description: 訂單總額
        note:
          type: string
          maxLength: 500
          description: 備註
        createdAt:
          type: string
          format: date-time
          description: 建立時間
        updatedAt:
          type: string
          format: date-time
          description: 更新時間
      required:
      - id
      - customerId
      - status
      - totalAmount
      - createdAt
    OrderRequest:
      type: object
      properties:
        customerId:
          type: integer
          format: int64
          description: 下單客戶
        status:
          type: string
          enum:
          - pending
          - paid
          - shipped
          - cancelled
          description: 訂單狀態
        totalAmount:
          type: number
          format: decimal
          description: 訂單總額
        note:
          type: string
          maxLength: 500
          description: 備註
      required:
      - customerId
      - status
      - totalAmount
  responses:
    BadRequest:
      description: 請求參數錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 資源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 衝突（樂觀鎖 / 唯一鍵 / 狀態機）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
